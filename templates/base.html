<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0A0A0A"><title>{% block title %}Machine Learning{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body>
    <div class="site-grid" aria-hidden="true"></div>
    <nav class="navbar" aria-label="Main navigation">
        <a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">ML</span><span>Machine Learning</span></a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Toggle navigation menu"><span></span><span></span><span></span></button>
        <div class="nav-links" id="nav-links">
            <a class="{{ 'active' if request.endpoint == 'home' else '' }}" href="{{ url_for('home') }}">Home</a>
            <a class="{{ 'active' if request.endpoint == 'definition' else '' }}" href="{{ url_for('definition') }}">Definition</a>
            <a class="{{ 'active' if request.endpoint == 'types' else '' }}" href="{{ url_for('types') }}">Types</a>
            <div class="nav-dropdown {{ 'active' if request.endpoint in ('use_case_1','use_case_2','use_case_3','use_case_4') else '' }}">
                <button class="nav-dropdown-trigger" type="button" aria-haspopup="true" aria-expanded="false">Use Cases <span class="caret">▾</span></button>
                <div class="nav-dropdown-menu">
                    <a class="nav-dropdown-item disabled" aria-disabled="true" tabindex="-1">Use Case 1 <span class="soon">Coming soon</span></a>
                    <a class="nav-dropdown-item disabled" aria-disabled="true" tabindex="-1">Use Case 2 <span class="soon">Coming soon</span></a>
                    <a class="nav-dropdown-item {{ 'active' if request.endpoint == 'use_case_3' else '' }}" href="{{ url_for('use_case_3') }}">Use Case 3 — Customer Segmentation</a>
                    <a class="nav-dropdown-item {{ 'active' if request.endpoint == 'use_case_4' else '' }}" href="{{ url_for('use_case_4') }}">Use Case 4 — Vehicle Demand Forecasting</a>
                </div>
            </div>
        </div>
    </nav>
    {% block content %}{% endblock %}
    <footer><span>Machine Learning</span><span class="footer-dot">•</span> A concise introduction to intelligent systems</footer>
    <script>
        (function () {
            var toggle = document.querySelector('.nav-toggle');
            var links = document.getElementById('nav-links');
            if (toggle && links) {
                toggle.addEventListener('click', function () {
                    var open = links.classList.toggle('open');
                    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
                });
            }
            var dropdown = document.querySelector('.nav-dropdown');
            var trigger = document.querySelector('.nav-dropdown-trigger');
            if (dropdown && trigger) {
                trigger.addEventListener('click', function (e) {
                    e.stopPropagation();
                    var open = dropdown.classList.toggle('open');
                    trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
                });
                document.addEventListener('click', function (e) {
                    if (!dropdown.contains(e.target)) {
                        dropdown.classList.remove('open');
                        trigger.setAttribute('aria-expanded', 'false');
                    }
                });
            }
        })();
    </script>
</body>
</html>
