<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0A0A0A">

    <title>{% block title %}Solar ML Project{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <div class="site-grid" aria-hidden="true"></div>

    <nav class="navbar" aria-label="Main navigation">

        <a class="brand" href="{{ url_for('home') }}">
            <span class="brand-mark">ML</span>
            <span>Solar ML Project</span>
        </a>

        <div class="nav-links">

            <!-- Home -->
            <a
                class="{{ 'active' if request.endpoint == 'home' else '' }}"
                href="{{ url_for('home') }}"
            >
                Home
            </a>

            <!-- Machine Learning Concepts -->
            <a
                class="{{ 'active' if request.endpoint == 'definition' else '' }}"
                href="{{ url_for('definition') }}"
            >
                Concepts
            </a>

            <!-- Types of Machine Learning -->
            <a
                class="{{ 'active' if request.endpoint == 'types' else '' }}"
                href="{{ url_for('types') }}"
            >
                Types
            </a>

            <!-- Supervised Learning -->
            <div
                class="nav-group {{ 'active-group' if request.endpoint in ['linear_regression_concepts', 'linear_regression_application'] else '' }}"
            >

                <button
                    class="nav-group-toggle"
                    type="button"
                >
                    Supervised Learning
                    <span>+</span>
                </button>

                <div class="nav-menu">

                    <span>Linear Regression</span>

                    <a
                        class="{{ 'active' if request.endpoint == 'linear_regression_concepts' else '' }}"
                        href="{{ url_for('linear_regression_concepts') }}"
                    >
                        Concepts
                    </a>

                    <a
                        class="{{ 'active' if request.endpoint == 'linear_regression_application' else '' }}"
                        href="{{ url_for('linear_regression_application') }}"
                    >
                        Application
                    </a>

                </div>

            </div>

        </div>

    </nav>

    <!-- Page content -->
    {% block content %}
    {% endblock %}

    <footer>
        <span>Solar Energy Machine Learning</span>
        <span class="footer-dot">&bull;</span>
        <span>Learn from real environmental data</span>
    </footer>

</body>
</html>
